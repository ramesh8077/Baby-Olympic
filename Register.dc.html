  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = templateEl.textContent.trim().replace(/<\\\/script>/g, '</' + 'script>');

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

        <style>
          x-dc {
            display: block;
          }
          body {
            margin: 0;
            background: #f7f1fd;
            color: #2e1b47;
            font-family: "Poppins", sans-serif;
            -webkit-font-smoothing: antialiased;
          }
          a {
            color: #b026d6;
            text-decoration: none;
          }
          a:hover {
            color: #3b1264;
          }
          .wrap {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 clamp(20px, 4vw, 32px);
            box-sizing: border-box;
          }
          .hero {
            background: linear-gradient(135deg, #7b2ff7, #c13fd6);
            position: relative;
            overflow: hidden;
          }
          .heroPad {
            padding: clamp(52px, 7vw, 76px) 0 clamp(26px, 4vw, 36px);
            text-align: center;
          }
          .starDeco {
            position: absolute;
            color: #ffd400;
            font-size: 20px;
            animation: tw 3s ease-in-out infinite;
          }
          @keyframes tw {
            0%,
            100% {
              opacity: 0.4;
              transform: scale(0.85);
            }
            50% {
              opacity: 1;
              transform: scale(1.15);
            }
          }
          .kicker {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: "Baloo 2", sans-serif;
            font-weight: 700;
            font-size: 13px;
            color: #ffd400;
          }
          .star {
            color: #ffd400;
            font-size: 14px;
            animation: tw 2.2s ease-in-out infinite;
            display: inline-block;
          }
          .h1 {
            font-family: "Baloo 2", sans-serif;
            font-weight: 800;
            font-size: clamp(28px, 4vw, 42px);
            color: #fff;
            margin: 12px 0 10px;
          }
          .sub {
            font-size: 15.5px;
            line-height: 1.6;
            color: #f0e0fa;
            max-width: 560px;
            margin: 0 auto;
          }
          .feeChip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #fff;
            border-radius: 999px;
            padding: 9px 18px;
            font-family: "Baloo 2", sans-serif;
            font-weight: 700;
            font-size: 13.5px;
            color: #3b1264;
            margin-top: 16px;
          }
          .formCard {
            background: #fff;
            border-radius: 24px;
            max-width: 780px;
            margin: 16px auto 90px;
            padding: clamp(24px, 4vw, 44px);
            box-sizing: border-box;
            box-shadow: 0 20px 50px -20px rgba(59, 18, 100, 0.3);
          }
          .progWrap {
            display: flex;
            margin: 0 0 30px;
          }
          .progStep {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            flex: 1;
            position: relative;
          }
          .progBar {
            position: absolute;
            top: 19px;
            left: calc(-50% + 24px);
            width: calc(100% - 48px);
            height: 4px;
            border-radius: 2px;
            background: #f0e4fa;
          }
          .progStep.done .progBar,
          .progStep.on .progBar {
            background: #ffd400;
          }
          .progDot {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid #f0e4fa;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Baloo 2", sans-serif;
            font-weight: 700;
            font-size: 15px;
            z-index: 1;
            color: #3b1264;
          }
          .progStep.on .progDot {
            background: linear-gradient(180deg, #8b3fe8, #6b21c9);
            color: #fff;
            border-color: #8b3fe8;
          }
          .progStep.done .progDot {
            background: #ffd400;
            border-color: #ffd400;
            color: #3b1264;
          }
          .progLabel {
            font-size: 11px;
            font-weight: 700;
            color: #8a76a3;
            text-align: center;
            max-width: 100px;
          }
          .stepTitle {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
          }
          .stepIcon {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: #f7f1fd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
            flex-shrink: 0;
          }
          .stepH {
            font-family: "Baloo 2", sans-serif;
            font-weight: 700;
            font-size: clamp(19px, 2.4vw, 23px);
            margin: 0;
            color: #3b1264;
          }
          .stepSub {
            margin: 2px 0 0;
            font-size: 13px;
            color: #8a76a3;
            font-weight: 500;
          }
          .frow {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
          }
          .fld {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 15px;
          }
          .lab {
            font-family: "Baloo 2", sans-serif;
            font-weight: 700;
            font-size: 13.5px;
            color: #2e1b47;
          }
          .req {
            color: #ff3fa4;
          }
          .inp {
            border: 2px solid #e4d6f7;
            border-radius: 12px;
            padding: 12px 15px;
            font-family: "Poppins", sans-serif;
            font-size: 15px;
            background: #fff;
            color: #2e1b47;
            width: 100%;
            box-sizing: border-box;
          }
          .inp:focus {
            outline: none;
            border-color: #b026d6;
          }
          .help {
            font-size: 11.5px;
            color: #8a76a3;
            font-weight: 500;
          }
          .err {
            color: #ff3fa4;
            font-size: 12px;
            font-weight: 700;
            display: none;
          }
          .err.show {
            display: block;
          }
          .ageBox {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #f7f1fd;
            border: 2px dashed #b026d6;
            border-radius: 14px;
            padding: 14px 16px;
          }
          .ageIcon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #fff;

    <script type="text/x-dc" data-dc-script="">
      class Component extends DCLogic {
        constructor(props) {
          super(props);
          let draft = {};
          try { draft = JSON.parse(localStorage.getItem('bog-reg-draft') || '{}'); } catch (err) { draft = {}; }
          this.state = {
            menuOpen: false, step: 1, success: false, regId: '', confetti: [],
            f: Object.assign({ parentName: '', mobile: '', email: '', city: 'Kanpur', state: 'Uttar Pradesh', childName: '', dob: '', gender: '', games: [], school: '', medical: '', emName: '', emPhone: '', photoName: '', certName: '', consentTerms: false, consentPhoto: false }, draft, { consentTerms: false, consentPhoto: false }),
            e: { parentName: '', mobile: '', email: '', city: '', childName: '', dob: '', gender: '', games: '', emName: '', emPhone: '', consent: '' }
          };
        }
        persist() {
          const { games, consentTerms, consentPhoto, photoName, certName, ...rest } = this.state.f;
          try { localStorage.setItem('bog-reg-draft', JSON.stringify({ ...rest, games })); } catch (err) {}
        }
        ageAtEvent() {
          if (!this.state.f.dob) return null;
          const d = new Date(this.state.f.dob + 'T00:00:00');
          if (isNaN(d)) return null;
          const ev = new Date('2026-09-08T00:00:00');
          let a = ev.getFullYear() - d.getFullYear();
          const m = ev.getMonth() - d.getMonth();
          if (m < 0 || (m === 0 && ev.getDate() < d.getDate())) a--;
          return a;
        }
        catFor(a) {
          const cats = {
            2: { name: 'Little Champion (2–3)', emoji: '🥉', games: ['Toddler dash', 'Balance walk', 'Ring toss', 'Hop-along fun'] },
            3: { name: 'Young Explorer (3–4)', emoji: '🧭', games: ['Running race', 'Mini hurdles', 'Tunnel crawl', 'Relay starter'] },
            4: { name: 'Future Champion (4–5)', emoji: '🎯', games: ['Sprint race', 'Agility track', 'Tricycle race', 'Dribble & score'] },
            5: { name: 'Rising Star (5–6)', emoji: '🏆', games: ['Relay race', 'Target throw', 'Try-a-sport', 'Balance beam'] },
            6: { name: 'Champion Squad (6–8)', emoji: '⚽', games: ['Football', 'Cricket', 'Relay race', 'Try-a-sport'] }
          };
          return cats[Math.min(6, Math.max(2, a))] || null;
        }
        validate(step) {
          const f = this.state.f, e = { parentName: '', mobile: '', email: '', city: '', childName: '', dob: '', gender: '', games: '', emName: '', emPhone: '', consent: '' };
          let ok = true;
          const fail = (k, msg) => { e[k] = msg; ok = false; };
          if (step === 1) {
            if (!/^[A-Za-z\u0900-\u097F][A-Za-z\u0900-\u097F .']{2,}$/.test(f.parentName.trim())) fail('parentName', 'Please enter a name (min 3 letters).');
            if (!/^[6-9]\d{9}$/.test(f.mobile.trim())) fail('mobile', 'Enter a valid 10-digit Indian mobile number.');
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(f.email.trim())) fail('email', 'Enter a valid email address.');
            if (!f.city.trim()) fail('city', 'City is required.');
          }
          if (step === 2) {
            if (f.childName.trim().length < 2) fail('childName', "Please enter your child's name.");
            const a = this.ageAtEvent();
            if (a === null) fail('dob', 'Please pick a date of birth.');
            else if (a < 2 || a > 8) fail('dob', 'Your child must be 2–8 years old on 8 Sept 2026.');
            if (!f.gender) fail('gender', 'Please select one.');
            if (!f.games.length) fail('games', 'Pick at least one game.');
          }
          if (step === 3) {
            if (f.emName.trim().length < 3) fail('emName', 'Emergency contact name is required.');
            if (!/^[6-9]\d{9}$/.test(f.emPhone.trim())) fail('emPhone', 'Enter a valid 10-digit mobile number.');
            else if (f.emPhone.trim() === f.mobile.trim()) fail('emPhone', 'Should be different from the parent mobile.');
          }
          if (step === 4 && (!f.consentTerms || !f.consentPhoto)) fail('consent', 'Both consents are required to submit.');
          this.setState({ e });
          return ok;
        }
        renderVals() {
          const st = this.state, f = st.f;
          const age = this.ageAtEvent();
          const cat = age !== null && age >= 2 && age <= 8 ? this.catFor(age) : null;
          const labels = ['Parent', 'Child', 'Emergency', 'Consent'];
          return {
            menuOpen: st.menuOpen, toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
            fee: '₹499 per child',
            notSuccess: !st.success, success: st.success, regId: st.regId, confetti: st.confetti,
            s1: st.step === 1, s2: st.step === 2, s3: st.step === 3, s4: st.step === 4,
            psteps: labels.map((label, i) => ({ label, mark: st.step > i + 1 ? '✓' : String(i + 1), cls: st.step === i + 1 ? 'on' : (st.step > i + 1 ? 'done' : ''), bar: i > 0 })),
            f, e: st.e,
            onField: (ev) => {
              const t = ev.target; let v = t.type === 'checkbox' ? t.checked : t.value;
              if (t.type === 'file') v = t.files && t.files[0] ? t.files[0].name : '';
              this.setState(s => {
                const nf = { ...s.f, [t.name]: v };
                if (t.name === 'dob') nf.games = [];
                return { f: nf };
              }, () => this.persist());
            },
            toggleGame: (ev) => {
              const g = ev.currentTarget.dataset.g;
              this.setState(s => {
                const has = s.f.games.includes(g);
                return { f: { ...s.f, games: has ? s.f.games.filter(x => x !== g) : [...s.f.games, g] } };
              }, () => this.persist());
            },
            next: () => { if (this.validate(st.step)) { this.setState({ step: st.step + 1 }); window.scrollTo({ top: 0, behavior: 'smooth' }); } },
            back: () => { this.setState({ step: Math.max(1, st.step - 1) }); window.scrollTo({ top: 0, behavior: 'smooth' }); },
            submit: () => {
              if (!this.validate(4)) return;
              const id = 'BOG-2026-' + String(Math.floor(10000 + Math.random() * 90000));
              const subject = 'Baby Olympic Games Registration Enquiry - ' + id;
              const body = ['New registration enquiry:', 'Registration ID: ' + id, 'Parent Name: ' + f.parentName, 'Mobile: ' + f.mobile, 'Email: ' + f.email, 'City: ' + f.city, 'State: ' + f.state, 'Child Name: ' + f.childName, 'Child DOB: ' + f.dob, 'Gender: ' + f.gender, 'Category: ' + (cat ? cat.name : 'to be confirmed'), 'Games: ' + f.games.join(', '), 'School: ' + (f.school || 'Not provided'), 'Medical Notes: ' + (f.medical || 'None'), 'Emergency Contact: ' + f.emName, 'Emergency Phone: ' + f.emPhone].join('\n');
              window.location.href = 'mailto:babyolympicgames@gmail.com?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
              const colors = ['#FF3FA4', '#FFD400', '#4CD3C2', '#8B3FE8', '#3B1264'];
              const confetti = Array.from({ length: 46 }, (_, i) => ({
                left: (Math.random() * 100).toFixed(1) + '%', background: colors[i % colors.length],
                width: (7 + Math.random() * 8).toFixed(0) + 'px', height: (10 + Math.random() * 10).toFixed(0) + 'px',
                animationDelay: (Math.random() * 1.2).toFixed(2) + 's', animationDuration: (2.4 + Math.random() * 2.4).toFixed(2) + 's'
              }));
              this.setState({ success: true, regId: id, confetti });
              window.scrollTo({ top: 0, behavior: 'smooth' });
            },
            parentFirst: (f.parentName.trim().split(' ')[0] || 'champion'),
            catEmoji: cat ? cat.emoji : '⭐',
            catTxt: cat ? cat.name : (age !== null ? 'Outside the 2–8 age range' : 'Auto-filled from date of birth'),
            ageSub: cat ? 'Age on event day: ' + age + ' — category auto-mapped' : 'Pick the date of birth to see the category',
            gameOpts: (cat ? cat.games : []).map(name => ({ name, on: f.games.includes(name) ? 'on' : '' })),
            gBoy: f.gender === 'Boy' ? 'on' : '', gGirl: f.gender === 'Girl' ? 'on' : '', gNA: f.gender === 'Prefer not to say' ? 'on' : '',
            photoLabel: f.photoName || 'Tap to upload a photo', certLabel: f.certName || 'Tap to upload the certificate',
            ckT: f.consentTerms ? 'on' : '', ckP: f.consentPhoto ? 'on' : '',
            submitDis: (f.consentTerms && f.consentPhoto) ? '' : 'dis',
            icsHref: 'data:text/calendar;charset=utf8,' + encodeURIComponent('BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//BOG//Kanpur2026//EN\nBEGIN:VEVENT\nUID:bog-kanpur-2026\nDTSTART:20260908T033000Z\nDTEND:20260911T123000Z\nSUMMARY:Baby Olympic Games Kanpur 2026\nLOCATION:Kanpur\nDESCRIPTION:India\'s youngest sporting movement, ages 2-8.\nEND:VEVENT\nEND:VCALENDAR'),
            shareHref: 'https://wa.me/?text=' + encodeURIComponent("We just registered for Baby Olympic Games Kanpur 2026! Ages 2-8, 8-11 Sept in Kanpur. Register your little champion too!")
          };
        }
      }
    <\/script>
